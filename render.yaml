# Notch hosted demo on Render. DEVNET ONLY, test money only.
# The sealed computer is NOT here: it is the Phala confidential VM (deploy/phala/README.md).
# VITE_* values are compiled into the app, so changing one needs a new deploy of the static site.
services:
  - type: web
    runtime: static
    name: notch-bureau
    rootDir: app
    buildCommand: npx -y pnpm@12.21.0 install --frozen-lockfile && npx -y pnpm@12.21.0 run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_ENCLAVE_URL
        value: https://0015f90bd03804232678c956ce789b09384f4b1d-8787.dstack-pha1-prod9.phala.network
      - key: VITE_FAUCET_URL
        value: https://notch-bureau-faucet.onrender.com
      - key: VITE_RPC_URL
        value: https://api.devnet.solana.com
      - key: VITE_PROGRAM_ID
        value: 4ucSsrca8WS9LxJvoQZdhFscYnZ8DGDKMYcBhmBNPLVz
      - key: VITE_USDC_MINT
        value: 8w1jur5oikV5aax7Q8eTSZwfZwVvFQDTknMTREJ75NNS
      # Optional, client-side publishable values. Unset: the matching feature is hidden (the status is polled).
      - key: VITE_POLLAR_KEY
        sync: false
      - key: VITE_WC_PROJECT_ID
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false

  # Test-money faucet: transfers devnet SOL and test USDC from its own wallet (app/scripts/faucet-server.mjs).
  - type: web
    runtime: node
    name: notch-bureau-faucet
    plan: starter
    rootDir: app
    buildCommand: npx -y pnpm@12.21.0 install --frozen-lockfile --prod
    startCommand: node scripts/faucet-server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: FAUCET_KEY # secret: the dedicated faucet wallet, base58 or JSON array. Never the admin key.
        sync: false
      - key: RPC_URL
        value: https://api.devnet.solana.com
      - key: MINT
        value: 8w1jur5oikV5aax7Q8eTSZwfZwVvFQDTknMTREJ75NNS
