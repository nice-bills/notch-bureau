<html lang="en">

  <body>
    <div id="root"><div class="splash" role="status" aria-label="Loading Notch"><svg viewBox="0 0 26 26" width="56" height="56" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="8" fill="#111A33"/><path d="M8.5 18V8.5l9 9V8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Loading Notch…</span></div></div>
